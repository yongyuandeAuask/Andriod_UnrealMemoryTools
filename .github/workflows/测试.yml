name: Build UnrealMemoryTools

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Ninja & CMake
      run: sudo apt update && sudo apt install -y ninja-build cmake

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r26d

    - name: Configure CMake (with NDK toolchain)
      run: |
        cmake -S . -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=30 \
          -DANDROID_NDK=${{ steps.setup-ndk.outputs.ndk-path }}
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

    - name: Build
      run: cmake --build build -j4

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UnrealMemoryTools
        path: build/
